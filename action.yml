name: Tree-sitter setup
description: Set up the tree-sitter library & CLI

branding:
  color: green
  icon: sliders

inputs:
  install-cli:
    description: Install the CLI
    default: "true"
  install-lib:
    description: Install the library
    default: "true"
  tree-sitter-ref:
    description: A tree-sitter commit, tag, or branch
    default: latest
  rust-toolchain:
    description: Rust toolchain
    default: stable

runs:
  using: composite
  steps:
    - name: Install the CLI
      uses: cerfcast/setup-action/cli@0cb673b4052b91fc074a0e24ff0829d75ddffe43
      if: inputs.install-cli == 'true'
      with:
        rust-toolchain: ${{inputs.rust-toolchain}}
        tree-sitter-ref: ${{inputs.tree-sitter-ref}}
    - name: Install the library
      uses: cerfcast/setup-action/lib@ef3e6f46277b42fc49f2fa4e41b1a4b2454c4ff9
      if: inputs.install-lib == 'true'
      with:
        tree-sitter-ref: ${{inputs.tree-sitter-ref}}
